  <body>
    <header class="app">
      <span class="brand"><img src="./assets/logo.png" alt="BTF" width="22" height="22" /> BTF 质押</span>
      <span class="badge" id="network-badge">—</span>
      <span class="spacer"></span>
      <button class="btn btn--small" id="connect" type="button">连接钱包</button>
    </header>

    <main>
      <section class="card">
        <h2 id="summary-title">我的资产</h2>
        <div id="summary"></div>
        <p class="status" id="status">连接钱包后读取链上数据。</p>
      </section>

      <section class="card">
        <h2>选择质押期限</h2>
        <div class="tiers" id="tiers"></div>
        <div class="stack" style="margin-top: 12px">
          <label class="field">
            质押数量（<span id="symbol-label">BTF</span>）
            <input id="amount" inputmode="decimal" autocomplete="off" placeholder="0.00" />
          </label>
          <div class="row">
            <button class="btn btn--ghost btn--small" id="max" type="button">全部余额</button>
            <span class="spacer"></span>
          </div>
          <div class="row small muted" id="amount-hint"></div>
          <button class="btn" id="stake" type="button">确认质押</button>
          <p class="small muted">
            质押会把代币转入合约金库。锁仓档位到期前无法取回本金；到期后本金与未领奖励可一起取回。
          </p>
        </div>
      </section>

      <section class="card">
        <h2>我的质押</h2>
        <div class="positions" id="positions"></div>
      </section>

      <section class="card">
        <h2>关于 BTF</h2>
        <div class="about" id="about"></div>
      </section>

      <section class="card">
        <h2>规则说明</h2>
        <ul class="small muted" style="padding-left: 18px; margin: 0; display: grid; gap: 6px">
          <li>奖励全部来自项目方预先存入的奖励金库，不会增发新代币。</li>
          <li>每笔质押在开仓时锁定当时的 APR，之后项目方调整 APR 不影响已开仓位。</li>
          <li>奖励按秒线性累计，最多累计到该档位的计息窗口结束（灵活档为 365 天）。</li>
          <li>奖励池不足以覆盖新仓位的最大应付奖励时，新质押会被合约拒绝。</li>
          <li>合约没有任何让项目方提取用户本金或已承诺奖励的指令。</li>
        </ul>
      </section>
